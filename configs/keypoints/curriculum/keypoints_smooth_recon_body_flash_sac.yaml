# keypoints_recon_body_flash_sac.yaml (generated by scripts/train/make_orientation_curriculum.py)
# with exactly two weights changed in the shared stage weights, 100x each:
#   action_rate_l2  -0.0001  -> -0.01    step-to-step change of the policy action
#   action_l2       -0.000001 -> -0.0001 size of the policy action (the residual on top of SONIC)
# NVIDIA's G1 recipe emits 10 x tanh actions, so at the stock weights the penalty is ~0.5% of the
# per-step reward and the residual shakes every joint 5-6 deg per step (outputs/diag/jitter).
# Everything else -- thresholds, VOC schedule, reset probabilities, other weights -- is unchanged.

_target_: flash_chord.configuration.make_fixed_curriculum

thresholds: [35000320, 70000640, 104998912, 139999232, 174999552, 209999872, 288749568, 306249728, 349999104]

stages:
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 1.0
    objective_weights: &orientation_recon_body_weights
      termination: -300.0
      action_rate_l2: -0.01
      action_l2: -0.0001
      soft_joint_limit: -0.001
      pelvis_position: 1.0
      pelvis_orientation: 1.0
      body_joint_position: 5.0
      object_position: 1.0
      progress: 1.0
      palm_position: 1.0
      palm_orientation: 1.0
      force_closure: 5.0
      object_keypoints: 5.0
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.75
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.5
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.25
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.1
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.05
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *orientation_recon_body_weights
    immediate_first_frame_probability: 0.25
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *orientation_recon_body_weights
    immediate_first_frame_probability: 0.50
