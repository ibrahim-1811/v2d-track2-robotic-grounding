# keypoints_recon_body_flash_sac.yaml (generated by scripts/train/make_orientation_curriculum.py)
# with the same thirteen weights in every stage and only the VOC schedule changed.
# The VOC assist (external PD wrench + gravity compensation on the object) fades 2.5x more slowly:
#   upstream  0.5 -> 0 over 105M steps (0.25, 0.1, 0.05 for 35M each), then 140M at zero assist
#   here      0.5 -> 0 over 262.5M steps (0.35, 0.25, 0.15, 0.08, 0.04 for 52.5M each), then the
#             same 140M at zero assist with upstream's reset probabilities (78.75M / 17.5M / 43.75M)
# Total 507,500,544 steps (pass training.total_environment_steps=507500544). Measured reason: in the
# four object-dropping Tier 1 episodes object terminations climb exactly as the assist fades
# (bottle ep25: 11% of episodes at voc 1.0, 47% at 0.1, 72% at 0). Thresholds are multiples of
# 2048 (one collection at 2048 worlds); the first three are upstream's own.

_target_: flash_chord.configuration.make_fixed_curriculum

thresholds: [35000320, 70000640, 104998912, 157499392, 209999872, 262500352, 315000832, 367499264, 446251008, 463749120, 507500544]

stages:
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 1.0
    objective_weights: &orientation_recon_body_weights
      termination: -300.0
      action_rate_l2: -0.0001
      action_l2: -0.000001
      soft_joint_limit: -0.001
      pelvis_position: 1.0
      pelvis_orientation: 1.0
      body_joint_position: 5.0
      object_position: 1.0
      progress: 1.0
      palm_position: 1.0
      palm_orientation: 1.0
      force_closure: 5.0
      object_keypoints: 5.0
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.75
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.5
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.35
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.25
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.15
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.08
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.04
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *orientation_recon_body_weights
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *orientation_recon_body_weights
    immediate_first_frame_probability: 0.25
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights: *orientation_recon_body_weights
    immediate_first_frame_probability: 0.50
